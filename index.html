<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Quill AI — Publish-ready copy from a two-line brief</title>
    <meta
      name="description"
      content="Quill AI turns a two-line brief into publish-ready copy — blog posts, emails, ads, translations, and SEO briefs — in your brand voice, in seconds."
    />
    <meta name="theme-color" content="#05060F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Quill AI — Publish-ready copy from a two-line brief" />
    <meta
      property="og:description"
      content="Blog posts, emails, ads, translations, and SEO briefs drafted in your brand voice. Brief it over coffee, publish by lunch."
    />
    <meta property="og:site_name" content="Quill AI" />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quill AI — Publish-ready copy from a two-line brief" />
    <meta
      name="twitter:description"
      content="Blog posts, emails, ads, translations, and SEO briefs drafted in your brand voice."
    />
    <meta name="twitter:image" content="/og-image.svg" />

    <script>
      try {
        var t = localStorage.getItem("quill-theme");
        document.documentElement.classList.add(t === "light" ? "light" : "dark");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
